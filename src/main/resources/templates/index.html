<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle} != null ? ${pageTitle} : 'Investir Mais - Thymeleaf + React'">Investir Mais - Thymeleaf + React</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/dist/assets/index.css}" href="/dist/assets/index.css" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #12101b;
      margin: 0;
      padding: 0;
      color: #e4e4e7;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>


  <script th:inline="javascript">
    /*<![CDATA[*/
    window.__THYMELEAF_DATA__ = {
      appName: /*[[${appName}]]*/ 'Investir Mais',
      pageTitle: /*[[${pageTitle}]]*/ 'Autenticação',
      targetPage: /*[[${targetPage}]]*/ 'Login',
      serverTime: /*[[${serverTime}]]*/ '',
      serverEngine: /*[[${serverEngine}]]*/ 'Thymeleaf 3 + Spring Boot',
      serverMessage: /*[[${serverMessage}]]*/ 'Template carregado via Thymeleaf',
      roleRequired: /*[[${roleRequired}]]*/ null,
      authenticatedUser: /*[[${authenticatedUser}]]*/ null,
      authorities: /*[[${authorities}]]*/ 'ANONYMOUS'
    };
    /*]]>*/
  </script>

  <!-- Container raiz onde o React monta -->
  <div id="root">
    <div style="min-height: calc(100vh - 45px); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; color: #a1a1aa;">
      <div style="width: 40px; height: 40px; border: 3px solid rgba(251, 191, 36, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="font-size: 0.95rem;">Carregando componentes React...</p>
    </div>
  </div>

  <script type="module" th:src="@{/dist/assets/index.js}" src="/dist/assets/index.js"></script>
</body>
</html>
